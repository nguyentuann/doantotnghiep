# ============================================================
# CONFIG.YAML — Nguồn sự thật duy nhất cho toàn bộ dự án
# KHÔNG hardcode bất kỳ số nào vào code, luôn đọc từ file này
# ============================================================

# --- Phạm vi địa lý (Biển Đông Việt Nam) ---
geography:
  lat_min: 8.0
  lat_max: 22.0
  lon_min: 102.0
  lon_max: 120.0
  year_start: 1945
  year_end: 2024

# --- Đường dẫn dữ liệu ---
data:
  raw_file:     'data/raw/ibtracs_WP.csv'        # IBTrACS WP — dữ liệu gốc, KHÔNG sửa
  clean_file:   'data/processed/bao_bien_dong_1960.csv'
  feature_file: 'data/features/feature_matrix.csv'
  sst_dir:      'data/raw/sst/'                  # (legacy) NOAA OI SST .nc theo từng năm
  era5_dir:     'data/era5/pressure_4lev/'        # Sprint 1: 4 levels (200/500/700/850) + geopotential
  noaa_sst:     'data/noaa_sst/sst.mnmean.nc'    # NOAA OISST v2 monthly mean 1°
  time_step_hours: 6

# --- Cài đặt làm sạch dữ liệu (G1 → G2) ---
cleaning:
  track_type: 'main'         # Chỉ giữ track_type == 'main', bỏ 'spur'
  min_wind_kt: 25            # Loại bỏ record có tốc độ gió < 25 kt
  skiprows: [1]              # Hàng 2 trong IBTrACS CSV là units row

# --- Feature engineering (G2 → G3) ---
features:
  names:
    - lat_norm
    - lon_norm
    - dlat
    - dlon
    - speed_kmh
    - direction
    - vmax
    - pmin
    - sst_actual
    - month_sin
    - month_cos
    - storm_age_h
    - dist2land
    - wind_shear
    - u500          # U-wind 500 hPa tại tâm bão (steering flow)
    - v500          # V-wind 500 hPa tại tâm bão
    - u700          # U-wind 700 hPa tại tâm bão (steering flow)
    - v700          # V-wind 700 hPa tại tâm bão
    - z500          # Geopotential height 500 hPa (hPa ridge/trough)
    - u200          # U-wind 200 hPa (upper outflow, recurvature signal)
    - v200          # V-wind 200 hPa
    - u850          # U-wind 850 hPa (low-level steering)
    - v850          # V-wind 850 hPa
    - vort500       # Relative vorticity 500 hPa (×10⁵ s⁻¹) — environmental rotation
    - vort850       # Relative vorticity 850 hPa — low-level circulation
    - beta_lat_drift  # Beta drift physics prior (Holland 1983) — poleward
    - beta_lon_drift  # Beta drift physics prior (Holland 1983) — westward
    - asteer_u        # Annulus 3-7° deep-layer-mean steering U (Chan & Gray 1982)
    - asteer_v        # Annulus 3-7° deep-layer-mean steering V — bỏ vortex bão
    - asteer_u850     # Annulus 3-7° tại 850 hPa — low-level steering cho bão yếu
    - asteer_v850     # Annulus 3-7° tại 850 hPa
    # - asteer_u200   # ❌ scs_v13: redundant với u200/v200 box-avg (val MAE +19 km)
    # - asteer_v200
    - enso_oni        # ✅ scs_v14: Oceanic Niño Index — ENSO modulates WPSH + TC tracks
  n_features: 32             # 31 (v12) + enso_oni (32) — asteer_u200/v200 removed (failed)
  wind_primary:   'WMO_WIND' # Ưu tiên 1: gió 10 phút (JMA/WMO chuẩn)
  wind_cma:       'CMA_WIND' # Ưu tiên 2: CMA — chính xác nhất cho SCS
  wind_fallback:  'USA_WIND' # Fallback:  gió 1 phút (JTWC)
  pres_primary:   'WMO_PRES'
  pres_cma:       'CMA_PRES' # Ưu tiên 2: CMA
  pres_fallback:  'USA_PRES'
  sst_climatology: true      # Dùng SST climatology khi không có file .nc

# --- Model (G3 → G5) ---
model:
  lookback: 8    
  horizon: 8      
  anchor_steps: [1, 2, 3, 4, 5, 6, 7, 8]  
  output_size: 16    
  hidden_size: 128
  num_layers: 2
  nhead: 4           
  dropout: 0.2
  noise_std: 0.05    
  batch_size: 32
  lr: 0.0005
  max_epochs: 300
  patience: 40    
  residual: true     
  swa: true              
  swa_start_frac: 0.75    
  swa_lr_scale: 0.5       

loss:
  weight_24h: 0.50  
  weight_48h: 0.20  
  lambda_smooth: 1.0 
  lambda_dir: 0.1   

split:
  train: [1979, 2016]
  val:   [2017, 2020]
  test:  [2021, 2024]

# --- Đường dẫn model output ---
output:
  checkpoint_dir: 'models/checkpoints/'
  best_model_pt:  'models/final/model_best.pt'
  onnx_model:     'models/final/model_best.onnx'
  scaler_path:    'models/scaler.pkl'
  results_log:    'results/results_log.json'
  figures_dir:    'results/figures/'

# --- Checkpoint conditions ---
checkpoints:
  g1_min_storms: 1000         # WP full: ~1800+ storms vs SCS 561
  g3_min_sequences: 5000
  g5_lstm_max_mae_km: 200
  g6_min_improvement_pct: 10
  g7_min_skill_score_pct: 20
